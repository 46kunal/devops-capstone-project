name: CI Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint with Flake8
        run: flake8 service tests
      - name: Run unit tests with nosetests
        run: nosetests -v
      - name: Build Docker image
        run: docker build -t customer-accounts:ci .
      - name: Capture REST and image evidence
        run: bash scripts/capture-evidence.sh
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: capstone-evidence
          path: evidence/*.txt
