apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-accounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-accounts
  template:
    metadata:
      labels:
        app: customer-accounts
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/customer-accounts:latest
          ports:
            - containerPort: 8080
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: customer-accounts-secret
                  key: api-token
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: customer-accounts-data
